name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up mise and the pinned tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          version: 2026.9.1
          install: true
          cache: true

      - name: Run tests
        run: mise run test

      - name: Run lint checks
        if: always()
        env:
          SKILL_SCAN_BASE: ${{ github.event.pull_request.base.sha }}
        run: mise run lint

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
        with:
          name: ci-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
