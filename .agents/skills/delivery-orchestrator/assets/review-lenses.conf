# Review lenses: which review skill the orchestrator suggests for a pull request.
#
# One lens per line: the lens, the review skill that covers it (- for the
# harness's own review), then optionally the path patterns that bring the lens
# in. A pattern matches the whole path of a changed file, and * crosses
# directories. "general" applies to every pull request.
#
# A lens also applies when the task file lists it in "review", or when someone
# labels the pull request review:<lens>. Map a lens only to a skill that is
# installed and knows something the general review does not.
#
# lens     skill             paths that bring the lens in
general    -
# security   security-review   */auth/* *secret* *.tf
# data       databricks-dbsql  *.sql */pipelines/*
